// ============================================================================
// 房间会话状态保存 (localStorage) —— 支持掉线后重新加入与销毁旧房重建
// ============================================================================
const ROOM_SESSION_KEY = 'chimera_room_session';
const ROOM_SESSION_TTL_MS = 30 * 60 * 1000; // 30 分钟内的会话视为可恢复

function saveRoomSession() {
    if (!netEngine.roomCode) {
        clearRoomSession();
        return;
    }
    try {
        const payload = {
            roomCode: netEngine.roomCode,
            isHost: netEngine.isHost,
            isSpectator: netEngine.isSpectator,
            myColor: netEngine.myColor,
            isPublic: netEngine.isPublic,
            proto: netEngine.proto,
            savedAt: Date.now(),
            // 仅房主保存局面快照，房主重连后可立即恢复；非房主重连后会向房主请求 sync
            board: netEngine.isHost ? board : null,
            turn: netEngine.isHost ? turn : null,
            enPassantTarget: netEngine.isHost ? enPassantTarget : null,
            history: netEngine.isHost ? gameStateHistory : null,
            lastMove: netEngine.isHost ? lastMove : null
        };
        localStorage.setItem(ROOM_SESSION_KEY, JSON.stringify(payload));
    } catch (e) {}
}

function loadRoomSession() {
    try {
        const raw = localStorage.getItem(ROOM_SESSION_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (!data || !data.roomCode) return null;
        if (Date.now() - (data.savedAt || 0) > ROOM_SESSION_TTL_MS) {
            // 超时会话视为已失效，清除
            localStorage.removeItem(ROOM_SESSION_KEY);
            return null;
        }
        return data;
    } catch (e) { return null; }
}

function clearRoomSession() {
    try { localStorage.removeItem(ROOM_SESSION_KEY); } catch (e) {}
}

function refreshResumeSessionDesc() {
    const el = document.getElementById('uiResumeSessionDesc');
    if (!el) return;
    const session = loadRoomSession();
    if (session) {
        el.textContent = t('resumeSessionDesc', session.roomCode);
    }
}

function updateResumeSessionVisibility() {
    const box = document.getElementById('resumeSessionBox');
    if (!box) return;
    // 已在房间内时不显示恢复入口
    if (netEngine.roomCode || netEngine.isActive()) {
        box.style.display = 'none';
        return;
    }
    const session = loadRoomSession();
    box.style.display = session ? 'block' : 'none';
    refreshResumeSessionDesc();
}

function resumePreviousSession() {
    const session = loadRoomSession();
    if (!session) {
        updateResumeSessionVisibility();
        return;
    }
    // 恢复通讯引擎选择并切到在线模式
    const protoRadio = document.querySelector(`input[name="netProto"][value="${session.proto || 'mqtt'}"]`);
    if (protoRadio) protoRadio.checked = true;
    netEngine.proto = session.proto || 'mqtt';

    if (session.isHost) {
        // 房主重连：恢复本地局面快照并以房主身份重新接管房间
        if (session.board) board = session.board;
        if (session.turn) turn = session.turn;
        enPassantTarget = session.enPassantTarget || null;
        if (session.history) gameStateHistory = session.history;
        lastMove = session.lastMove || null;
        positionCounts = {};
        bumpPosition();
        rebuildLog();
        hideBanner();
        selectedSq = null;
        currentLegalMoves = [];
        isGameOver = false;

        setMode('online');
        // 直接复用原房间码以房主身份重新接管，无需新建
        netEngine.isHost = true;
        netEngine.myColor = session.myColor;
        netEngine.isSpectator = false;
        netEngine.isPublic = !!session.isPublic;
        netEngine.roomCode = session.roomCode;

        document.getElementById('hostRoomCodeVal').textContent = session.roomCode;
        document.getElementById('hostInfoBox').style.display = 'block';
        clearChat();

        if (netEngine.proto === 'mqtt') {
        netEngine.initMqtt(() => {
            netEngine._mqttSubscribe('chimera128/room/' + netEngine.roomCode);
            if (netEngine.isPublic) {
                netEngine.heartbeatTimer = setInterval(() => {
                    netEngine.client.publish('chimera128/lobby/announcements', JSON.stringify({
                        type: 'beacon',
                        room: netEngine.roomCode,
                        hostColor: netEngine.myColor,
                        hostClientId: netEngine.clientId,
                        status: netEngine._roomJoined ? 'playing' : 'waiting',
                        _senderId: netEngine.clientId
                    }));
                }, 4000);
            }
            netEngine.logSys(t('msgReconnected'));
            render();
            checkEndConditions(false);
            updateStatusDisplay();
            saveRoomSession();
            netEngine.send({ type: 'sync', board, turn, enPassantTarget, history: gameStateHistory, hostColor: netEngine.myColor });
        });
        } else {
        netEngine._isResuming = true;
        netEngine.initWebRTC(session.roomCode, () => {
            netEngine.logSys(t('msgReconnected'));
            render();
            checkEndConditions(false);
            updateStatusDisplay();
            saveRoomSession();
        });
        }
    } else {
        // 非房主重连：以访客/观战身份重新加入，等待房主推送 sync
        setMode('online');
        netEngine.join(session.roomCode, !!session.isSpectator);
    }
    updateResumeSessionVisibility();
    closeAllModals();
}

function appendChatMessage(sender, text, type = 'player') {
    const box = document.getElementById('chatBox');
    const msg = document.createElement('div');
    msg.className = 'chat-msg ' + type;
    msg.textContent = `[${sender}]: ${text}`;
    box.appendChild(msg);
    box.scrollTop = box.scrollHeight;
}

let undoCountdownTimer = null;
function showUndoPrompt() {
    const box = document.getElementById('undoRequestBox');
    const fill = document.getElementById('undoTimerFill');
    const txt = document.getElementById('undoTimerText');
    box.classList.add('active');

    let left = 15;
    txt.textContent = left + 's';
    fill.style.width = '100%';

    clearInterval(undoCountdownTimer);
    undoCountdownTimer = setInterval(() => {
        left--;
        txt.textContent = left + 's';
        fill.style.width = (left / 15 * 100) + '%';
        if (left <= 0) {
            clearInterval(undoCountdownTimer);
            netEngine.respondUndo(false);
        }
    }, 1000);
}

function hideUndoPrompt() {
    clearInterval(undoCountdownTimer);
    document.getElementById('undoRequestBox').classList.remove('active');
}

function renderLobbyRooms() {
    const tbody = document.getElementById('roomListTbody');
    if (!tbody) return;
    const now = Date.now();
    // 过滤超过9秒失联以及自己创建的房间
    const activeRooms = Object.values(netEngine.publicRooms).filter(r =>
        (now - r.lastSeen < 9000) &&
        (!netEngine.roomCode || r.room !== netEngine.roomCode) &&
        (!netEngine.clientId || r.hostClientId !== netEngine.clientId)
    );

    if (!activeRooms.length) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;color:var(--ink-soft);">${t('noPublicRooms')}</td></tr>`;
        return;
    }

    tbody.innerHTML = '';
    activeRooms.forEach(room => {
        const isFull = room.status === 'playing';
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td style="font-family:monospace;font-weight:700;">${room.room}</td>
            <td>${room.hostColor === 'w' ? t('whiteSide') : t('blackSide')}</td>
            <td>${isFull ? t('roomStatusFull') : t('roomStatusJoinable')}</td>
            <td>
                ${isFull ? '' : `<button class="secondary join-room-btn" style="padding:2px 6px;font-size:0.75rem;">${t('joinBtn')}</button>`}
                <button class="secondary spec-room-btn" style="padding:2px 6px;font-size:0.75rem;${isFull ? '' : 'margin-left:3px;'}">${t('spectateBtn')}</button>
            </td>
        `;
        const joinBtn = tr.querySelector('.join-room-btn');
        if (joinBtn) joinBtn.addEventListener('click', () => {
            closeAllModals();
            setMode('online');
            netEngine.join(room.room, false);
        });
        tr.querySelector('.spec-room-btn').addEventListener('click', () => {
            closeAllModals();
            setMode('online');
            netEngine.join(room.room, true);
        });
        tbody.appendChild(tr);
    });
}

function getRulebookMarkup() {
    return RULEBOOK_MARKUP[currentLang] || RULEBOOK_MARKUP['en'];
}

function parseRulebookMarkup(text) {
    const tabs = [];
    const rawTabs = text.split(/\[tab:([^\]]+)\]/g).filter(x => x.trim());

    for (let i = 0; i < rawTabs.length; i += 2) {
        const title = rawTabs[i].trim();
        const content = rawTabs[i + 1].trim();
        tabs.push({ title, content });
    }
    return tabs;
}

function renderRuleTabContent(rawText, container) {
    container.innerHTML = '';
    const lines = rawText.split('\n');

    // 将连续的 "- " 行包裹进 <ul>，避免 <li> 直接挂在容器上导致项目符号踩在左边框
    let currentList = null;
    function flushList() {
        if (currentList) {
            container.appendChild(currentList);
            currentList = null;
        }
    }

    lines.forEach(line => {
        line = line.trim();
        if (!line) return;

        if (line.startsWith('# ')) {
            flushList();
            const h4 = document.createElement('h4');
            h4.textContent = line.substring(2);
            container.appendChild(h4);
        } else if (line.startsWith('> ')) {
            flushList();
            const block = document.createElement('div');
            block.style.cssText = 'padding:6px 10px;background:rgba(0,0,0,0.04);border-left:3px solid var(--accent);margin:6px 0;font-size:0.82rem;';
            block.textContent = line.substring(2);
            container.appendChild(block);
        } else if (line.startsWith('- ')) {
            if (!currentList) currentList = document.createElement('ul');
            const li = document.createElement('li');
            li.innerHTML = line.substring(2).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            currentList.appendChild(li);
        } else if (line.startsWith('[demo ') && line.endsWith(']')) {
            flushList();
            renderInteractiveRuleDemo(line, container);
        } else {
            flushList();
            const p = document.createElement('p');
            p.style.marginBottom = '6px';
            p.innerHTML = line.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            container.appendChild(p);
        }
    });
    flushList();
}

function renderInteractiveRuleDemo(tagLine, container) {
    const rows = parseInt(tagLine.match(/rows=(\d+)/)[1]);
    const cols = parseInt(tagLine.match(/cols=(\d+)/)[1]);
    const piecesStr = tagLine.match(/pieces="([^"]+)"/)[1];
    const _animMatch = tagLine.match(/anim="([^"]+)"/);
    const label = (tagLine.match(/label="([^"]+)"/) || [])[1] || '';

    const wrap = document.createElement('div');
    wrap.className = 'rule-demo-wrap';

    const grid = document.createElement('div');
    grid.className = 'rule-demo-grid';
    grid.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
    grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
    grid.style.aspectRatio = `${cols} / ${rows}`;
    wrap.appendChild(grid);

    if (label) {
        const caption = document.createElement('div');
        caption.className = 'rule-demo-caption';
        caption.textContent = label;
        wrap.appendChild(caption);
    }
    container.appendChild(wrap);

    function buildDemoState() {
        grid.innerHTML = '';
        const cells = Array.from({ length: rows }, () => Array(cols).fill(null));

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const cell = document.createElement('div');
                cell.className = 'demo-cell ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
                grid.appendChild(cell);
                cells[r][c] = cell;
            }
        }

        piecesStr.split(';').forEach(pItem => {
            const parts = pItem.split(',');
            const r = parseInt(parts[0]), c = parseInt(parts[1]);
            const color = parts[2];
            const comps = parts.slice(3);

            const pDiv = document.createElement('div');
            pDiv.className = 'piece';
            pDiv.setAttribute('data-color', color);
            pDiv.setAttribute('data-comps', comps.join(','));
            if (comps.includes('K')) pDiv.classList.add('royal');
            pDiv.innerHTML = getPieceSVG(comps[0], color);
            if (comps.length > 1) {
                const badge = document.createElement('div');
                badge.className = 'badge';
                badge.textContent = comps.join('+');
                pDiv.appendChild(badge);
            }
            cells[r][c].appendChild(pDiv);
        });

        return cells;
    }

    // 无 anim 时仅渲染静态棋盘
    if (!_animMatch) { buildDemoState(); return; }
    const animStr = _animMatch[1];

    // 有 anim 时渲染带重播按钮的 caption，并启动动画循环
    const caption = document.createElement('div');
    caption.className = 'rule-demo-caption';
    caption.innerHTML = `<span>${label}</span><button class="secondary replay-btn" style="padding:1px 6px;font-size:0.72rem;">${t('replayAnim')}</button>`;
    if (label) {
        // 替换之前已添加的纯文本 caption
        wrap.lastChild.remove();
    }
    wrap.appendChild(caption);

    let loopTimer = null;
    let kineticActive = false;
    let kineticSourceCell = null;
    let kineticMidCell = null;

    function playDemoLoop() {
        clearTimeout(loopTimer);
        const myGen = ruleDemoGen;
        const cells = buildDemoState();
        const steps = animStr.split('|');

        kineticActive = false;
        kineticSourceCell = null;
        kineticMidCell = null;

        let stepIndex = 0;
        function runNextStep() {
            if (myGen !== ruleDemoGen) return;
            if (stepIndex >= steps.length) {
                loopTimer = setTimeout(playDemoLoop, 1800);
                return;
            }
            const [fromStr, toStr] = steps[stepIndex].split('>');
            const [fr, fc] = fromStr.split(',').map(Number);
            const [tr, tc] = toStr.split(',').map(Number);

            const sourceCell = cells[fr][fc];
            const targetCell = cells[tr][tc];
            const pieceEl = sourceCell.querySelector('.piece');

            if (!pieceEl) {
                stepIndex++;
                runNextStep();
                return;
            }

            const srcComps = pieceEl.getAttribute('data-comps').split(',');
            const isChimera = srcComps.length > 1;
            const targetPiece = targetCell.querySelector('.piece');
            const isMidStep = stepIndex < steps.length - 1;
            const isKineticMid = isChimera && !targetPiece && isMidStep;
            const completingKinetic = kineticActive && !isKineticMid;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = cells[r][c];
                    if (completingKinetic && (cell === kineticSourceCell || cell === kineticMidCell)) continue;
                    cell.classList.remove('last-from', 'last-to', 'last-mid', 'mid-path');
                }
            }
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    cells[r][c].classList.remove('selected', 'move-target', 'capture-target', 'fusion-target', 'overlap-target');
                }
            }

            if (isKineticMid) {
                kineticActive = true;
                kineticSourceCell = sourceCell;
                kineticMidCell = targetCell;
            } else if (!completingKinetic) {
                kineticActive = false;
            }

            sourceCell.classList.add('selected');

            if (targetPiece) {
                const pColor = targetPiece.getAttribute('data-color');
                const srcColor = pieceEl.getAttribute('data-color');
                if (pColor === srcColor) targetCell.classList.add('fusion-target');
                else targetCell.classList.add('capture-target');
            } else if (isKineticMid) {
                targetCell.classList.add('overlap-target');
            } else {
                targetCell.classList.add('move-target');
            }

            setTimeout(() => {
                if (myGen !== ruleDemoGen) return;
                const fromRect = sourceCell.getBoundingClientRect();
                const toRect = targetCell.getBoundingClientRect();

                pieceEl.style.zIndex = '50';
                animateSegment(pieceEl, fromRect, toRect, 220, () => {
                    if (myGen !== ruleDemoGen) return;
                    sourceCell.classList.remove('selected');
                    targetCell.classList.remove('move-target', 'capture-target', 'fusion-target', 'overlap-target');

                    if (isKineticMid) {
                        sourceCell.classList.add('last-from');
                        targetCell.classList.add('last-mid', 'mid-path');
                    } else if (completingKinetic) {
                        targetCell.classList.add('last-to');
                        kineticActive = false;
                    } else {
                        sourceCell.classList.add('last-from');
                        targetCell.classList.add('last-to');
                    }

                    if (targetPiece) {
                        const pColor = targetPiece.getAttribute('data-color');
                        const srcColor = pieceEl.getAttribute('data-color');
                        if (pColor === srcColor) {
                            const srcComps = pieceEl.getAttribute('data-comps').split(',');
                            const tgtComps = targetPiece.getAttribute('data-comps').split(',');
                            const merged = fuseComponents({ comps: srcComps }, { comps: tgtComps });
                            pieceEl.setAttribute('data-comps', merged.join(','));
                            let badge = pieceEl.querySelector('.badge');
                            if (!badge) {
                                badge = document.createElement('div');
                                badge.className = 'badge';
                                pieceEl.appendChild(badge);
                            }
                            badge.textContent = merged.join('+');
                        }
                    }

                    targetCell.innerHTML = '';
                    targetCell.appendChild(pieceEl);
                    pieceEl.style.transform = 'none';
                    pieceEl.style.zIndex = '2';

                    if (myGen !== ruleDemoGen) return;
                    if (targetPiece) {
                        const pColor = targetPiece.getAttribute('data-color');
                        const srcColor = pieceEl.getAttribute('data-color');
                        if (pColor === srcColor) {
                            sfx.fusion();
                        } else {
                            sfx.capture();
                        }
                    } else if (isKineticMid) {
                        sfx.step1();
                    } else {
                        sfx.move();
                    }

                    stepIndex++;
                    setTimeout(runNextStep, 600);
                });
            }, 400);
        }
        setTimeout(() => { if (myGen === ruleDemoGen) runNextStep(); }, 400);
    }

    caption.querySelector('.replay-btn').addEventListener('click', playDemoLoop);
    activeRuleDemoCleanups.push(() => clearTimeout(loopTimer));
    playDemoLoop();
}

function openRulebookModal() {
    clearAllRuleDemos();
    document.getElementById('modalRules').classList.add('active'); // 移到前面：先让弹窗可见以获得真实容器尺寸
    const tabsData = parseRulebookMarkup(getRulebookMarkup());
    const header = document.getElementById('ruleTabsHeader');
    const body = document.getElementById('ruleContentBody');
    header.innerHTML = '';
    body.innerHTML = '';

    tabsData.forEach((tab, index) => {
        const btn = document.createElement('div');
        btn.className = 'rule-tab' + (index === 0 ? ' active' : '');
        btn.textContent = tab.title;
        btn.addEventListener('click', () => {
            header.querySelectorAll('.rule-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            clearAllRuleDemos();
            renderRuleTabContent(tab.content, body);
        });
        header.appendChild(btn);
    });

    renderRuleTabContent(tabsData[0].content, body);
}

// ============================================================================
// 12. 控制器与模式切换
// ============================================================================
function resetGame(fromRemote = false) {
    clearTimeout(aiTimer);
    aiThinking = false;
    hidePromoDialog();
    document.getElementById('aiStatus').textContent = '';
    initBoard();
    gameStateHistory = [];
    positionCounts = {};
    bumpPosition();
    rebuildLog();
    render();
    checkEndConditions(false);
    if (!isGameOver && isAiTurn()) scheduleAiMove(400);

    if (netEngine.isActive() && !fromRemote && netEngine.isHost) {
        netEngine.send({ type: 'sync', board, turn, enPassantTarget, history: [] });
    }
}

function undoMove(fromRemote = false) {
    if (aiThinking || gameStateHistory.length === 0 || promoCallback || isAnimating) return;
    if (step1State) cancelStep1();
    hidePromoDialog();
    clearTimeout(aiTimer);

    if (netEngine.isActive() && !fromRemote) {
        netEngine.requestUndo();
        return;
    }

    let rec;
    do {
        rec = gameStateHistory.pop();
        board = rec.board;
        turn = rec.turn;
        enPassantTarget = rec.enPassantTarget || null;
    } while (mode !== 'pvp' && mode !== 'online' && gameStateHistory.length > 0 && isAiTurn());

    isGameOver = false;
    selectedSq = null;
    currentLegalMoves = [];
    lastMove = gameStateHistory.length ? gameStateHistory[gameStateHistory.length - 1].lastMove : null;
    hideBanner();
    rebuildLog();
    render();
    checkEndConditions(false);
    sfx.undo();
    if (!isGameOver && isAiTurn()) scheduleAiMove(300);
}

function setMode(m) {
    const wasOnline = mode === 'online';
    mode = m;
    document.getElementById('modePvp').classList.toggle('active', mode === 'pvp');
    document.getElementById('modeAiB').classList.toggle('active', mode === 'ai_b');
    document.getElementById('modeAiW').classList.toggle('active', mode === 'ai_w');
    document.getElementById('aiDiffRow').style.display = (m === 'ai_b' || m === 'ai_w') ? 'flex' : 'none';
    document.getElementById('chatContainer').style.display = (m === 'online') ? 'flex' : 'none';

    if (wasOnline && m !== 'online') {
        // 离开在线模式时彻底清理：发布 host_close、断开 MQTT/WebRTC、隐藏房间码条、清空聊天与会话状态
        netEngine.announceHostClose();
        netEngine.cleanup();
        netEngine.roomCode = null;
        netEngine.myColor = null;
        netEngine.isHost = false;
        netEngine.isSpectator = false;
        document.getElementById('hostInfoBox').style.display = 'none';
        clearChat();
        clearRoomSession();
    }
    if (!isGameOver && isAiTurn()) scheduleAiMove(350);
}

function closeAllModals() {
    document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
}

// ============================================================================
// 13. 事件监听与启动
// ============================================================================
document.getElementById('modePvp').addEventListener('click', () => setMode('pvp'));
document.getElementById('modeAiB').addEventListener('click', () => setMode('ai_b'));
document.getElementById('modeAiW').addEventListener('click', () => setMode('ai_w'));

document.getElementById('diffEasy').addEventListener('click', () => {
    aiDifficulty = 'easy';
    document.querySelectorAll('.diff').forEach(b => b.classList.remove('active'));
    document.getElementById('diffEasy').classList.add('active');
});
document.getElementById('diffMed').addEventListener('click', () => {
    aiDifficulty = 'medium';
    document.querySelectorAll('.diff').forEach(b => b.classList.remove('active'));
    document.getElementById('diffMed').classList.add('active');
});
document.getElementById('diffHard').addEventListener('click', () => {
    aiDifficulty = 'hard';
    document.querySelectorAll('.diff').forEach(b => b.classList.remove('active'));
    document.getElementById('diffHard').classList.add('active');
});

document.getElementById('btnReset').addEventListener('click', () => {
    if (gameStateHistory.length > 0 && !confirm(t('confirmReset'))) return;
    resetGame();
});
document.getElementById('btnUndo').addEventListener('click', () => undoMove(false));
document.getElementById('btnSound').addEventListener('click', () => {
    sfx.enabled = !sfx.enabled;
    document.getElementById('btnSound').textContent = sfx.enabled ? t('soundOn') : t('soundOff');
});

document.getElementById('btnStay').addEventListener('click', tryStay);
document.getElementById('btnCancelStep').addEventListener('click', cancelStep1);

document.getElementById('btnOpenRules').addEventListener('click', openRulebookModal);
document.getElementById('btnCloseRules').addEventListener('click', () => {
    clearAllRuleDemos();
    document.getElementById('modalRules').classList.remove('active');
});

document.getElementById('btnOpenSettings').addEventListener('click', () => document.getElementById('modalSettings').classList.add('active'));
document.getElementById('btnCloseSettings').addEventListener('click', () => document.getElementById('modalSettings').classList.remove('active'));

document.getElementById('selTheme').addEventListener('change', (e) => {
    document.documentElement.setAttribute('data-theme', e.target.value);
});
document.getElementById('selPieceSet').addEventListener('change', (e) => {
    currentPieceSet = e.target.value;
    render();
});
document.getElementById('selLang').addEventListener('change', (e) => {
    currentLang = e.target.value;
    applyTranslations();
    // 若规则书弹窗处于打开状态，则按新语言重渲染当前激活标签页
    const rulesModal = document.getElementById('modalRules');
    if (rulesModal.classList.contains('active')) {
        openRulebookModal();
    }
});

// 页面卸载前保存当前房间会话状态到 localStorage，便于刷新后通过"重新加入"恢复
// 注意：不主动发布 host_close 信标，否则会破坏掉线后另一方仍在的可重连语义；
// 大厅扫描端会因心跳停止(>9s)自动剔除该房间条目，避免幽灵房间长期残留
window.addEventListener('beforeunload', () => {
    try {
        if (netEngine && netEngine.roomCode) {
            saveRoomSession();
        }
    } catch (e) {}
});

document.getElementById('btnOpenLobby').addEventListener('click', () => {
    document.getElementById('modalLobby').classList.add('active');
    if (!netEngine.client) {
        netEngine.initMqtt(() => renderLobbyRooms());
    }
    updateLobbyProtoVisibility();
    updateResumeSessionVisibility();
});
document.getElementById('btnCloseLobby').addEventListener('click', () => document.getElementById('modalLobby').classList.remove('active'));

document.getElementById('btnResumeSession').addEventListener('click', resumePreviousSession);
document.getElementById('btnDismissResume').addEventListener('click', () => {
    clearRoomSession();
    updateResumeSessionVisibility();
});

// 根据选择的通讯引擎切换公开房间列表的可见性：WebRTC 模式下不暴露大厅扫描
document.querySelectorAll('input[name="netProto"]').forEach(radio => {
    radio.addEventListener('change', updateLobbyProtoVisibility);
});

function updateLobbyProtoVisibility() {
    const proto = document.querySelector('input[name="netProto"]:checked');
    if (!proto) return;
    const section = document.getElementById('publicRoomsSection');
    if (!section) return;
    const isMqtt = proto.value === 'mqtt';
    section.style.display = isMqtt ? 'block' : 'none';
    document.getElementById('chkPublicRoom').closest('label').style.display = isMqtt ? 'inline' : 'none';
}

document.getElementById('btnCreateRoomSubmit').addEventListener('click', () => {
    // 已在房间中时直接销毁旧房间并创建新的，不再阻止
    if (netEngine.roomCode || netEngine.isActive()) {
        netEngine.announceHostClose();
        netEngine.cleanup();
        netEngine.roomCode = null;
        netEngine.myColor = null;
        netEngine.isHost = false;
        netEngine.isSpectator = false;
        clearChat();
        clearRoomSession();
    }
    const proto = document.querySelector('input[name="netProto"]:checked').value;
    const color = document.getElementById('selHostColor').value;
    const isPub = document.getElementById('chkPublicRoom').checked;

    netEngine.proto = proto;
    setMode('online');
    netEngine.startHost(color, isPub);
    // 不立即关闭大厅弹窗：房主需要查看并复制房间码；待对手加入或主动关闭弹窗后再隐藏
});

document.getElementById('btnCopyRoomCode').addEventListener('click', () => {
    const code = document.getElementById('hostRoomCodeVal').textContent;
    navigator.clipboard.writeText(code).then(() => {
        document.getElementById('btnCopyRoomCode').textContent = t('copied');
        setTimeout(() => { document.getElementById('btnCopyRoomCode').textContent = t('copyRoom'); }, 1500);
    });
});

document.getElementById('btnJoinManualRoom').addEventListener('click', () => {
    const code = document.getElementById('manualRoomCode').value.trim();
    if (code.length !== 8) {
        alert(t('invalidRoomCode'));
        return;
    }
    // 已在房间中时直接销毁旧房间再加入新的，不再阻止
    if (netEngine.roomCode || netEngine.isActive()) {
        netEngine.announceHostClose();
        netEngine.cleanup();
        netEngine.roomCode = null;
        netEngine.myColor = null;
        netEngine.isHost = false;
        netEngine.isSpectator = false;
        clearChat();
        clearRoomSession();
    }
    closeAllModals();
    setMode('online');
    netEngine.join(code, false);
});

document.getElementById('btnRefreshRooms').addEventListener('click', renderLobbyRooms);

document.getElementById('btnDisconnectNet').addEventListener('click', () => {
    if (confirm(t('confirmDisconnect'))) {
        netEngine.disconnect();
    }
});

document.getElementById('btnSendChat').addEventListener('click', () => {
    const input = document.getElementById('chatInput');
    const val = input.value.trim();
    if (!val) return;
    if (netEngine.isActive()) {
        netEngine.sendChat(val);
    } else {
        appendChatMessage(t('senderLocal'), val, 'player');
    }
    input.value = '';
});
document.getElementById('chatInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('btnSendChat').click();
});

document.getElementById('btnAcceptUndo').addEventListener('click', () => netEngine.respondUndo(true));
document.getElementById('btnRejectUndo').addEventListener('click', () => netEngine.respondUndo(false));

document.getElementById('btnCopyLog').addEventListener('click', () => {
    if (!gameStateHistory.length) return;
    let text = gameStateHistory.map((h, i) => `${i % 2 === 0 ? Math.floor(i/2 + 1) + '. ' : ''}${h.notation}`).join(' ');
    navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('btnCopyLog');
        btn.textContent = t('copied');
        setTimeout(() => { btn.textContent = t('copyLog'); }, 1500);
    });
});

// 初始化启动
currentLang = detectLanguage();
document.getElementById('selLang').value = currentLang;
initBoard();
bumpPosition();
render();
applyTranslations();
checkEndConditions(false);
</script>
